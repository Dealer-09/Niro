<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      cursor: default;
    }
    #sensor {
      width: 100%;
      height: 100%;
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="sensor"></div>
  <script>
    // Wait for Tauri's IPC to be injected, then listen for mouseenter
    const sensor = document.getElementById('sensor');
    sensor.addEventListener('mouseenter', () => {
      // Use Tauri's internal IPC bridge (injected automatically into every webview)
      if (window.__TAURI_INTERNALS__) {
        window.__TAURI_INTERNALS__.invoke('sensor_hover');
      }
    });
  </script>
</body>
</html>
