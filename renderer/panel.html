<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Niro</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="panel-wrapper">
    <div id="panel">

      <!-- Status Bar -->
      <div id="status-bar"></div>

      <!-- Header -->
      <div id="header">
        <div id="header-title">
          <div class="header-dot"></div>
          <h1>Niro</h1>
        </div>
        <div id="header-actions">
          <button class="header-btn" id="btn-clear" title="Clear chat">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="m19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
          <button class="header-btn" id="btn-settings" title="Settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <button class="header-btn" id="btn-close" title="Close panel">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Chat Area -->
      <div id="chat-area">
        <div id="empty-state">
          <div class="empty-icon">🐦</div>
          <p>Hey! I'm <strong>Niro</strong>, your desktop AI agent.<br>I can open apps, run commands, set timers, and more.</p>
        </div>
      </div>

      <!-- Quick Tasks -->
      <div id="task-area">
        <div id="task-grid"></div>
      </div>

      <!-- Input Area -->
      <div id="input-area">
        <div id="input-container">
          <button id="mic-btn" title="Voice input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
          </button>
          <input type="text" id="chat-input" placeholder="Message Niro..." autocomplete="off" spellcheck="false">
          <button id="send-btn" title="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
          <button id="stop-btn" class="hidden" title="Stop">■</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Settings Panel (slides in from right, full height) -->
  <div id="settings-overlay">
    <div id="settings-panel">

      <!-- Settings Header -->
      <div id="settings-header">
        <span>⚙️ Settings</span>
        <button id="settings-close-btn" title="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Settings Tabs -->
      <div id="settings-tabs">
        <button class="settings-tab active" data-tab="provider">AI Provider</button>
        <button class="settings-tab" data-tab="email">Email</button>
        <button class="settings-tab" data-tab="general">General</button>
      </div>

      <!-- Tab: AI Provider -->
      <div class="settings-tab-content active" id="tab-provider">
        <div class="field-row">
          <label>Provider</label>
          <div class="provider-tabs" id="provider-tabs">
            <button class="provider-tab" data-provider="groq">⚡ Groq</button>
            <button class="provider-tab" data-provider="gemini">✦ Gemini</button>
          </div>
        </div>

        <!-- Groq -->
        <div id="section-groq" class="provider-section">
          <div class="field-row">
            <label>Groq API Key <a class="field-link" href="#">console.groq.com</a></label>
            <div class="key-input-row">
              <input type="password" id="settings-groq-key" placeholder="gsk_...">
              <button class="btn-add-key" id="btn-add-groq-key" title="Add backup key">+</button>
            </div>
            <div id="groq-extra-keys" class="extra-keys-list"></div>
          </div>
        </div>

        <!-- Gemini -->
        <div id="section-gemini" class="provider-section hidden">
          <div class="field-row">
            <label>Gemini API Key <a class="field-link" href="#">aistudio.google.com</a></label>
            <div class="key-input-row">
              <input type="password" id="settings-gemini-key" placeholder="AIza...">
              <button class="btn-add-key" id="btn-add-gemini-key" title="Add backup key">+</button>
            </div>
            <div id="gemini-extra-keys" class="extra-keys-list"></div>
          </div>
        </div>

        <p class="settings-hint">Keys rotate automatically when daily quota is hit.</p>
      </div>

      <!-- Tab: Email -->
      <div class="settings-tab-content" id="tab-email">
        <div class="field-row">
          <label>Gmail Address</label>
          <input type="email" id="settings-gmail-user" placeholder="you@gmail.com">
        </div>
        <div class="field-row">
          <label>App Password <a class="field-link" href="#">get one here</a></label>
          <input type="password" id="settings-gmail-pass" placeholder="xxxx xxxx xxxx xxxx">
        </div>
        <p class="settings-hint">Use an App Password — not your Gmail password.<br>Enable 2FA first, then generate at myaccount.google.com/apppasswords</p>
      </div>

      <!-- Tab: General -->
      <div class="settings-tab-content" id="tab-general">
        <div class="field-row">
          <label>Hover Delay (ms)</label>
          <input type="text" id="settings-hover-delay" placeholder="800">
        </div>
        <div class="field-row">
          <div class="toggle-row">
            <label>Launch on Startup</label>
            <button class="toggle-switch" id="settings-autostart"></button>
          </div>
        </div>
      </div>

      <!-- Settings Footer -->
      <div id="settings-footer">
        <button class="btn-danger" id="settings-quit">Quit</button>
        <button class="btn-secondary" id="settings-cancel">Cancel</button>
        <button class="btn-primary" id="settings-save">Save</button>
      </div>

    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
